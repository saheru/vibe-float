<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Vibe Control</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    body { margin: 0; padding: 16px; background: #20242c; color: #edf2fb; font-size: 13px; }
    .panel { display: grid; gap: 14px; }
    label { display: grid; gap: 6px; color: #aeb8ca; }
    input, select, button { border: 1px solid #45516a; border-radius: 7px; padding: 8px 10px; background: #111722; color: #edf2fb; }
    .check { display: flex; align-items: center; gap: 9px; color: #c4ccda; }
    .check input { width: 17px; height: 17px; padding: 0; accent-color: #ffbd45; }
    button { cursor: pointer; background: #276ef1; border-color: #276ef1; font-weight: 700; }
    .hint { color: #7f8ca4; line-height: 1.5; }
    .status { display: flex; align-items: center; gap: 7px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #667085; }
    .dot.ok { background: #52d681; box-shadow: 0 0 7px #52d681; }
  </style>
</head>
<body>
  <div class="panel">
    <div class="status"><span id="dot" class="dot"></span><span id="status">正在连接插件…</span></div>
    <label id="slotRow" hidden>
      最近任务位置
      <select id="slot">
        <option value="0">第 1 个（最近）</option><option value="1">第 2 个</option>
        <option value="2">第 3 个</option><option value="3">第 4 个</option>
        <option value="4">第 5 个</option><option value="5">第 6 个</option>
        <option value="6">第 7 个</option><option value="7">第 8 个</option>
      </select>
    </label>
    <label id="notifyDoneRow" class="check" hidden>
      <input id="notifyDone" type="checkbox" checked>
      任务完成时播放提示音并通知
    </label>
    <label id="notifyInputRow" class="check" hidden>
      <input id="notifyInput" type="checkbox" checked>
      需要回复时播放提示音并通知
    </label>
    <label id="codexPathRow">
      Codex 可执行文件
      <input id="codexPath" placeholder="留空自动发现 codex">
    </label>
    <button id="enableClaudeUsage" hidden>启用 Claude Usage 采集</button>
    <button id="refresh">立即刷新</button>
    <div id="hint" class="hint"></div>
  </div>
  <script src="index.js"></script>
</body>
</html>
