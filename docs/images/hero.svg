<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720">
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#070b13"/>
      <stop offset=".5" stop-color="#121a2c"/>
      <stop offset="1" stop-color="#171029"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#172238"/>
      <stop offset="1" stop-color="#080c14"/>
    </linearGradient>
    <radialGradient id="blueGlow">
      <stop stop-color="#35a7ff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#35a7ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-40%" width="160%" height="190%">
      <feDropShadow dx="0" dy="28" stdDeviation="26" flood-color="#000" flood-opacity=".55"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1440" height="720" fill="url(#page)"/>
  <circle cx="260" cy="130" r="330" fill="url(#blueGlow)"/>
  <circle cx="1250" cy="610" r="420" fill="#8b5cf6" opacity=".08"/>
  <path d="M0 590C270 510 410 690 710 590s480-160 730-30v160H0z" fill="#35a7ff" opacity=".035"/>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
    <g transform="translate(110 112)">
      <rect x="0" y="0" width="72" height="72" rx="20" fill="#101827" stroke="#35a7ff" stroke-width="2"/>
      <rect x="13" y="14" width="12" height="44" rx="6" fill="#35a7ff"/>
      <rect x="30" y="22" width="12" height="36" rx="6" fill="#53d68a"/>
      <rect x="47" y="8" width="12" height="50" rx="6" fill="#b77cff"/>
      <text x="96" y="37" fill="#fff" font-size="38" font-weight="800">Vibe Float</text>
      <text x="97" y="68" fill="#91a0b8" font-size="18" font-weight="600">Codex + Claude 模块，自由组合</text>
    </g>

    <g transform="translate(106 300)" filter="url(#shadow)">
      <rect width="1228" height="260" rx="42" fill="#fff" opacity=".10" stroke="#fff" stroke-opacity=".16"/>

      <!-- Task 1 -->
      <g transform="translate(28 25)">
        <rect width="218" height="210" rx="30" fill="url(#card)" stroke="#35a7ff" stroke-width="3"/>
        <path d="M24 12h170" stroke="#35a7ff" stroke-width="3" opacity=".8"/>
        <circle cx="109" cy="76" r="43" fill="#35a7ff" opacity=".16" stroke="#35a7ff" stroke-width="5" filter="url(#glow)"/>
        <path d="M98 55l31 21-31 21z" fill="#35a7ff"/>
        <text x="109" y="145" fill="#fff" text-anchor="middle" font-size="30" font-weight="900">执行中</text>
        <text x="109" y="184" fill="#35a7ff" text-anchor="middle" font-size="25" font-weight="900" letter-spacing="3">CODE</text>
        <text x="194" y="28" fill="#35a7ff" text-anchor="end" font-size="14" font-weight="800">CX · #1</text>
      </g>

      <!-- Task 2 -->
      <g transform="translate(264 25)">
        <rect width="218" height="210" rx="30" fill="url(#card)" stroke="#ffbd45" stroke-width="3"/>
        <path d="M24 12h170" stroke="#ffbd45" stroke-width="3" opacity=".8"/>
        <circle cx="109" cy="76" r="43" fill="#ffbd45" opacity=".16" stroke="#ffbd45" stroke-width="5" filter="url(#glow)"/>
        <text x="109" y="91" fill="#ffbd45" text-anchor="middle" font-size="47" font-weight="900">?</text>
        <text x="109" y="145" fill="#fff" text-anchor="middle" font-size="30" font-weight="900">待回复</text>
        <text x="109" y="184" fill="#ffbd45" text-anchor="middle" font-size="25" font-weight="900" letter-spacing="3">DEMO</text>
        <text x="194" y="28" fill="#ffbd45" text-anchor="end" font-size="14" font-weight="800">CL · #2</text>
      </g>

      <!-- Task 3 -->
      <g transform="translate(500 25)">
        <rect width="218" height="210" rx="30" fill="url(#card)" stroke="#53d68a" stroke-width="3"/>
        <path d="M24 12h170" stroke="#53d68a" stroke-width="3" opacity=".8"/>
        <circle cx="109" cy="76" r="43" fill="#53d68a" opacity=".16" stroke="#53d68a" stroke-width="5" filter="url(#glow)"/>
        <path d="M88 77l15 15 30-35" fill="none" stroke="#53d68a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="109" y="145" fill="#fff" text-anchor="middle" font-size="30" font-weight="900">完成</text>
        <text x="109" y="184" fill="#53d68a" text-anchor="middle" font-size="25" font-weight="900" letter-spacing="3">SHIP</text>
        <text x="194" y="28" fill="#53d68a" text-anchor="end" font-size="14" font-weight="800">CX · #3</text>
      </g>

      <!-- Sol -->
      <g transform="translate(736 25)">
        <rect width="218" height="210" rx="30" fill="url(#card)" stroke="#ffbd45" stroke-width="3"/>
        <path d="M24 12h170" stroke="#ffbd45" stroke-width="3" opacity=".8"/>
        <text x="109" y="77" fill="#fff" text-anchor="middle" font-size="43" font-weight="950">CX · SOL</text>
        <rect x="42" y="100" width="134" height="56" rx="28" fill="#ffbd45" opacity=".14" stroke="#ffbd45" stroke-width="3"/>
        <text x="109" y="138" fill="#ffbd45" text-anchor="middle" font-size="27" font-weight="950">HIGH</text>
        <text x="109" y="186" fill="#77869d" text-anchor="middle" font-size="14" font-weight="700">点击切换</text>
      </g>

      <!-- Usage -->
      <g transform="translate(972 25)">
        <rect width="228" height="210" rx="30" fill="url(#card)" stroke="#53d68a" stroke-width="3"/>
        <path d="M24 12h180" stroke="#53d68a" stroke-width="3" opacity=".8"/>
        <text x="114" y="39" fill="#d8e0ed" text-anchor="middle" font-size="22" font-weight="900">CX · 周</text>
        <circle cx="114" cy="117" r="62" fill="none" stroke="#243149" stroke-width="17"/>
        <circle cx="114" cy="117" r="62" fill="none" stroke="#53d68a" stroke-width="17" stroke-linecap="round"
          stroke-dasharray="171 390" transform="rotate(-90 114 117)" filter="url(#glow)"/>
        <text x="114" y="131" fill="#fff" text-anchor="middle" font-size="39" font-weight="950">44%</text>
      </g>
    </g>

    <text x="720" y="645" fill="#a8b5c9" text-anchor="middle" font-size="18" font-weight="600">
      Codex + Claude Code · macOS · Windows · StreamDock
    </text>
  </g>
</svg>
