name: Build Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "windows/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish single-file app
        shell: pwsh
        run: |
          dotnet publish windows/CodexFloat/CodexFloat.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o artifacts/windows-x64
          Compress-Archive -Path artifacts/windows-x64/VibeFloat.exe `
            -DestinationPath artifacts/Vibe-Float-Windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Vibe-Float-Windows-x64
          path: artifacts/Vibe-Float-Windows-x64.zip

      - name: Upload tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/Vibe-Float-Windows-x64.zip
