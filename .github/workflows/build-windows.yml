name: Build Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "windows/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish portable app
        shell: pwsh
        run: |
          dotnet publish windows/CodexFloat/CodexFloat.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            -p:DebugType=None `
            -o artifacts/windows-x64/Vibe-Float
          Copy-Item windows/package/* artifacts/windows-x64/Vibe-Float/

      - name: Smoke-test Windows startup
        shell: pwsh
        run: |
          $exe = Resolve-Path artifacts/windows-x64/Vibe-Float/VibeFloat.exe
          $process = Start-Process $exe -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) {
            $log = Join-Path $env:LOCALAPPDATA 'Vibe Float\startup.log'
            if (Test-Path $log) { Get-Content $log }
            throw "Vibe Float exited during startup with code $($process.ExitCode)"
          }
          Stop-Process -Id $process.Id -Force

      - name: Package portable app
        shell: pwsh
        run: |
          Compress-Archive -Path artifacts/windows-x64/Vibe-Float `
            -DestinationPath artifacts/Vibe-Float-Windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Vibe-Float-Windows-x64
          path: artifacts/Vibe-Float-Windows-x64.zip

      - name: Upload tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/Vibe-Float-Windows-x64.zip
