name: Build Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "windows/**"
      - "scripts/harness.ps1"
      - "global.json"
      - ".github/workflows/build-windows.yml"
  pull_request:
    paths:
      - "windows/**"
      - "scripts/harness.ps1"
      - "global.json"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish portable app
        shell: pwsh
        run: ./scripts/harness.ps1 publish-windows

      - name: Smoke-test Windows startup
        shell: pwsh
        run: ./scripts/harness.ps1 smoke-windows

      - name: Package portable app
        shell: pwsh
        run: |
          Compress-Archive -Path artifacts/windows-x64/Vibe-Float `
            -DestinationPath artifacts/Vibe-Float-Windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Vibe-Float-Windows-x64
          path: artifacts/Vibe-Float-Windows-x64.zip

      - name: Upload tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/Vibe-Float-Windows-x64.zip
