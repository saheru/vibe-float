<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="background" x1="130" y1="90" x2="900" y2="950" gradientUnits="userSpaceOnUse">
      <stop stop-color="#192a46"/>
      <stop offset=".52" stop-color="#0c1527"/>
      <stop offset="1" stop-color="#070b13"/>
    </linearGradient>
    <linearGradient id="rim" x1="140" y1="110" x2="890" y2="920" gradientUnits="userSpaceOnUse">
      <stop stop-color="#56c5ff"/>
      <stop offset=".48" stop-color="#347cff"/>
      <stop offset="1" stop-color="#9b62ff"/>
    </linearGradient>
    <linearGradient id="panel" x1="240" y1="205" x2="790" y2="800" gradientUnits="userSpaceOnUse">
      <stop stop-color="#243c61"/>
      <stop offset=".5" stop-color="#14233b"/>
      <stop offset="1" stop-color="#0d1728"/>
    </linearGradient>
    <linearGradient id="taskBlue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#67d5ff"/>
      <stop offset="1" stop-color="#3188ff"/>
    </linearGradient>
    <linearGradient id="effort" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#cda6ff"/>
      <stop offset="1" stop-color="#8154ff"/>
    </linearGradient>
    <linearGradient id="usage" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#72f2bc"/>
      <stop offset="1" stop-color="#28c977"/>
    </linearGradient>
    <radialGradient id="glow" cx=".28" cy=".16" r=".9">
      <stop stop-color="#329eff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#329eff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shellShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="34" stdDeviation="30" flood-color="#000" flood-opacity=".52"/>
    </filter>
    <filter id="panelShadow" x="-35%" y="-35%" width="170%" height="190%">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#000" flood-opacity=".48"/>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="13" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Native app tile -->
  <g filter="url(#shellShadow)">
    <rect x="72" y="72" width="880" height="880" rx="220" fill="url(#background)"/>
    <rect x="88" y="88" width="848" height="848" rx="204" fill="none" stroke="url(#rim)" stroke-width="12"/>
    <rect x="111" y="111" width="802" height="802" rx="183" fill="url(#glow)"/>
  </g>

  <!-- Floating five-zone Codex dashboard -->
  <g filter="url(#panelShadow)" transform="rotate(-2 512 512)">
    <rect x="188" y="205" width="648" height="610" rx="102" fill="url(#panel)" stroke="#6aa9ff" stroke-opacity=".42" stroke-width="8"/>
    <rect x="215" y="232" width="594" height="556" rx="78" fill="none" stroke="#d9edff" stroke-opacity=".08" stroke-width="5"/>

    <!-- Three recent task cards -->
    <g>
      <rect x="244" y="282" width="154" height="190" rx="42" fill="#0b1526" stroke="#4d7eb5" stroke-opacity=".62" stroke-width="6"/>
      <rect x="435" y="282" width="154" height="190" rx="42" fill="#0b1526" stroke="#4d7eb5" stroke-opacity=".62" stroke-width="6"/>
      <rect x="626" y="282" width="154" height="190" rx="42" fill="#0b1526" stroke="#4d7eb5" stroke-opacity=".62" stroke-width="6"/>

      <!-- Codex task terminal glyphs -->
      <path d="M284 338l32 27-32 27M328 397h32" fill="none" stroke="url(#taskBlue)" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M475 338l32 27-32 27M519 397h32" fill="none" stroke="url(#taskBlue)" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M666 338l32 27-32 27M710 397h32" fill="none" stroke="url(#taskBlue)" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- running / waiting / done -->
      <circle cx="368" cy="312" r="16" fill="#48a6ff" filter="url(#softGlow)"/>
      <circle cx="559" cy="312" r="16" fill="#ffbd4a" filter="url(#softGlow)"/>
      <circle cx="750" cy="312" r="16" fill="#49df91" filter="url(#softGlow)"/>
    </g>

    <!-- Sol effort control -->
    <g>
      <rect x="244" y="516" width="250" height="220" rx="52" fill="#0b1526" stroke="#795bd2" stroke-opacity=".7" stroke-width="6"/>
      <circle cx="369" cy="613" r="53" fill="none" stroke="#6844bd" stroke-width="18" opacity=".44"/>
      <circle cx="369" cy="613" r="33" fill="url(#effort)" filter="url(#softGlow)"/>
      <path d="M369 543v-19M369 702v-19M299 613h-19M458 613h-19M319 563l-14-14M433 677l-14-14M419 563l14-14M305 677l14-14"
            stroke="#c7a7ff" stroke-width="11" stroke-linecap="round"/>
      <rect x="297" y="690" width="144" height="12" rx="6" fill="#8d67eb" opacity=".8"/>
    </g>

    <!-- Weekly usage progress ring -->
    <g>
      <rect x="530" y="516" width="250" height="220" rx="52" fill="#0b1526" stroke="#3d9e73" stroke-opacity=".7" stroke-width="6"/>
      <circle cx="655" cy="616" r="62" fill="none" stroke="#263d45" stroke-width="20"/>
      <circle cx="655" cy="616" r="62" fill="none" stroke="url(#usage)" stroke-width="20" stroke-linecap="round"
              stroke-dasharray="292 390" transform="rotate(-90 655 616)" filter="url(#softGlow)"/>
      <path d="M627 616l19 19 39-45" fill="none" stroke="#eafff4" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="583" y="690" width="144" height="12" rx="6" fill="#46d990" opacity=".8"/>
    </g>
  </g>

  <!-- Float cue: detached dock shadow -->
  <ellipse cx="512" cy="855" rx="230" ry="30" fill="#02050b" opacity=".5"/>
</svg>
