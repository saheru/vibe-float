<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="shell" x1="160" y1="110" x2="870" y2="930" gradientUnits="userSpaceOnUse">
      <stop stop-color="#17243d"/>
      <stop offset=".48" stop-color="#0c1425"/>
      <stop offset="1" stop-color="#070b13"/>
    </linearGradient>
    <linearGradient id="edge" x1="190" y1="130" x2="850" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#55b8ff"/>
      <stop offset=".48" stop-color="#397dff"/>
      <stop offset="1" stop-color="#9a63ff"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#63c7ff"/>
      <stop offset="1" stop-color="#288cff"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#67efad"/>
      <stop offset="1" stop-color="#32c978"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#c59aff"/>
      <stop offset="1" stop-color="#8a56ff"/>
    </linearGradient>
    <radialGradient id="glow" cx=".25" cy=".16" r=".86">
      <stop stop-color="#35a7ff" stop-opacity=".30"/>
      <stop offset="1" stop-color="#35a7ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="32" stdDeviation="30" flood-color="#000" flood-opacity=".48"/>
    </filter>
    <filter id="barGlow" x="-80%" y="-30%" width="260%" height="160%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="72" y="72" width="880" height="880" rx="220" fill="url(#shell)"/>
    <rect x="88" y="88" width="848" height="848" rx="204" fill="none" stroke="url(#edge)" stroke-width="12" opacity=".92"/>
    <rect x="111" y="111" width="802" height="802" rx="183" fill="url(#glow)"/>
  </g>

  <g filter="url(#barGlow)">
    <rect x="248" y="342" width="132" height="404" rx="66" fill="url(#blue)"/>
    <rect x="446" y="430" width="132" height="316" rx="66" fill="url(#green)"/>
    <rect x="644" y="258" width="132" height="488" rx="66" fill="url(#violet)"/>
  </g>

  <g opacity=".32" fill="#fff">
    <rect x="271" y="365" width="86" height="176" rx="43"/>
    <rect x="469" y="453" width="86" height="120" rx="43"/>
    <rect x="667" y="281" width="86" height="206" rx="43"/>
  </g>

  <circle cx="800" cy="228" r="62" fill="#ffbd45"/>
  <circle cx="800" cy="228" r="38" fill="#fff" opacity=".34"/>
  <path d="M800 197v62M769 228h62" stroke="#fff" stroke-width="17" stroke-linecap="round"/>

  <path d="M256 806h512" stroke="#4b5f7f" stroke-width="18" stroke-linecap="round" opacity=".42"/>
</svg>
